name: "03 · Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          [ "${{ inputs.confirm }}" = "DESTROY" ] || \
            (echo "❌ Confirmation string invalid" && exit 1)

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: tf-apply-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.IAC_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/staging/backend.tfvars" \
            -reconfigure

      - name: Destroy
        run: |
          terraform destroy \
            -var-file="environments/staging/terraform.tfvars" \
            -auto-approve
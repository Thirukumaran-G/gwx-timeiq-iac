name: "02 · Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: staging
        type: choice
        options: [staging]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: "Apply — staging"
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: tf-apply-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.IAC_SA_EMAIL }}
          project_id: gwx-devops-internship

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/staging/backend.tfvars" \
            -reconfigure

      - name: Plan
        run: |
          terraform plan \
            -var-file="environments/staging/terraform.tfvars" \
            -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan

      - name: Print outputs
        run: |
          echo "LB_IP=$(terraform output -raw lb_ip)"
          echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket)"
          echo "BACKEND_SERVICE=$(terraform output -raw backend_service_name)"

      - name: Summary
        run: |
          echo "## Apply complete ✅ — staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| LB IP | $(terraform output -raw lb_ip) |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend bucket | $(terraform output -raw frontend_bucket) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend service | $(terraform output -raw backend_service_name) |" >> $GITHUB_STEP_SUMMARY
name: "03 · Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [staging, prod]
      confirm:
        description: "Type DESTROY to confirm"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          [ "${{ inputs.confirm }}" = "DESTROY" ] || \
            (echo "❌ Confirmation string invalid" && exit 1)
          [ "${{ inputs.environment }}" != "prod" ] || \
            (echo "❌ Prod destroy is blocked via automation" && exit 1)

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: tf-apply-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'prod' && secrets.IAC_SA_EMAIL_PROD || secrets.IAC_SA_EMAIL_STAGING }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/${{ inputs.environment }}/backend.tfvars" \
            -reconfigure

      - name: Destroy
        run: |
          terraform destroy \
            -var-file="environments/${{ inputs.environment }}/terraform.tfvars" \
            -auto-approve